[package]
name = "mainlynorfolk-mcp"
version = "1.1.4"
edition = "2024"
description = "MCP server exposing the Mainly Norfolk English folk archive as a GraphQL API"
repository = "https://github.com/radiosilence/mainlynorfolk-mcp"
license = "MIT"
keywords = ["mcp", "folk", "music", "ballads", "graphql"]
categories = ["command-line-utilities", "api-bindings"]

[[bin]]
# The package names the archive; the binary is what gets typed and what a
# desktop client puts in its config.
name = "folk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-graphql = { version = "7", features = ["dataloader"] }
axum = "0.8"
askama = "0.16"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
futures-util = "0.3"
http = "1"
open = "5"
percent-encoding = "2"
reqwest = { version = "0.13.5", default-features = false, features = [
  "form",
  "json",
  "gzip",
  "rustls",
] }
rmcp = { version = "3", features = [
  "server",
  "transport-io",
  "transport-streamable-http-server",
] }
schemars = "1"
scraper = "0.27"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
codegen-units = 16
